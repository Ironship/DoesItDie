name: Package and release

# Pushing a tag like v0.2.1 builds DoesItDie-v0.2.1.zip and uploads it
# to CurseForge (project ID read from X-Curse-Project-ID in the TOC).
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the packager create a GitHub Release too
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: BigWigsMods/packager@v2
